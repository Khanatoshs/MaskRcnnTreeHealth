# Band-ablation variant 'rgb_ndvi': R, G, B, NDVI
# Generated by scripts/run_band_ablation.py from config.ini.
# Masks are shared with the full-band run so ground truth is identical.

[TRAIN]
num_classes = 5
num_input_channels = 4
batch_size = 2
val_batch_size = 1
learning_rate = 1e-4
weight_decay = 5e-4
num_epochs = 100
early_stopping_patience = 30
warmup_epochs = 10
warmup_start_factor = 0.1
lr_schedule = cosine
lr_min_factor = 0.01
checkpoint_monitor = pooled_f1
checkpoint_dir = checkpoints_rgb_ndvi
metrics_dir = checkpoints_rgb_ndvi/metrics
num_workers = 2
pin_memory = True
amp = False
save_best_only = True
iou_threshold = 0.5
dataset_dir = data/dataset_sliced_800_rgb_ndvi
log_level = INFO
device = cuda
train_val_split = 0.8
split_by_plot = true
mask_label_divisor = 10000
image_mean = 0.4850,0.4560,0.4060,0.5266
image_std = 0.2290,0.2240,0.2250,0.1108
anchor_sizes = 112,144,184,216,288
anchor_aspect_ratios = 0.62,1.0,1.36
log_file = checkpoints_rgb_ndvi/training.log

[EVAL]
CHECKPOINT = checkpoints_rgb_ndvi/maskrcnn_best.pth
SPLIT = all
DATASET_DIR = data/dataset_sliced_800_rgb_ndvi_test
SCORE_THRESHOLD = 0.5
IOU_THRESHOLD = 0.5
OUT_DIR = checkpoints_rgb_ndvi/metrics
LEGACY_ANCHOR_SIZES = 
LEGACY_ANCHOR_ASPECT_RATIOS = 
LEGACY_IMAGE_MEAN = 
LEGACY_IMAGE_STD = 

[VISUALIZE]
CHECKPOINT = checkpoints_rgb_ndvi/maskrcnn_best.pth
SPLIT = val
DATASET_DIR = data/dataset_sliced_800_rgb_ndvi
NUM_TILES = 10
SCORE_THRESHOLD = 0.5
IOU_THRESHOLD = 0.5
OUT = checkpoints_rgb_ndvi/visualizations/predictions_val.png
LEGACY_ANCHOR_SIZES = 
LEGACY_ANCHOR_ASPECT_RATIOS = 
LEGACY_IMAGE_MEAN = 
LEGACY_IMAGE_STD = 

[MULTICHANNEL]
rgb_img_path = data/tiff/rgb_new2.tiff
ndvi_img_path = data/tiff/ndvi_new3.tiff
chm_img_path = data/tiff/chm_Re11_Clip11.tif
cire_img_path = data/tiff/cire48sampled_Clip1.tif
gndvi_img_path = data/tiff/gndvi48Nsamp_Clip11.tif
ndre_img_path = data/tiff/ndre48samp_Clip11.tif
output_dir = results
output_name = stacked_8ch_out
log_level = INFO

[CUT_PLOTS]
VRT_FILE = results/stacked_rgb_ndvi.vrt
PLOT_SHAPEFILE = data/annotations/mesh.shp
OUTPUT_FOLDER = data/cropped_plots_rgb_ndvi
log_level = INFO

[MASKS]
PLOTS_DIR = data/cropped_plots/train
TREE_SHAPEFILE = data/annotations/NDVI_mean3.shp
OUTPUT_DIR = data/train_plot_masks
TREE_CLASS_PROPERTY = tree_class
TEST_PLOTS_DIR = data/cropped_plots/test
TEST_OUTPUT_DIR = data/test_plot_masks
MIN_TREE_HEIGHT = 2.0
CHM_BAND = 4

[SLICING]
PLOTS_DIR = data/cropped_plots_rgb_ndvi/train
MASKS_DIR = data/train_plot_masks
OUTPUT_DIR = data/dataset_sliced_800_rgb_ndvi
WINDOW_SIZE = 800
OVERLAP_PCT = 50.0
log_level = INFO
MIN_INSTANCE_COMPLETENESS = 0.6
TEST_PLOTS_DIR = data/cropped_plots_rgb_ndvi/test
TEST_MASKS_DIR = data/test_plot_masks
TEST_OUTPUT_DIR = data/dataset_sliced_800_rgb_ndvi_test

