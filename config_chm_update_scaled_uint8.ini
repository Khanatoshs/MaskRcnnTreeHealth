[TRAIN]
num_classes = 5
num_input_channels = 8
batch_size = 2
val_batch_size = 1
learning_rate = 1e-4
weight_decay = 5e-4
num_epochs = 100
early_stopping_patience = 30
warmup_epochs = 10
warmup_start_factor = 0.1
lr_schedule = cosine
lr_min_factor = 0.01
checkpoint_monitor = pooled_f1
checkpoint_dir = results/checkpoints_chm_update_scaled_uint8
metrics_dir = results/checkpoints_chm_update_scaled_uint8/metrics
num_workers = 2
pin_memory = True
amp = False
save_best_only = True
iou_threshold = 0.5
dataset_dir = data/new_data_chm_update/dataset_sliced_800
log_level = INFO
log_file = train_chm_update_scaled_uint8.log
device = cuda
train_val_split = 0.8
split_by_plot = true
mask_label_divisor = 10000
input_preprocessing = scaled_uint8
# scaled_uint8 mode maps every band into [0,1] via a fixed physical range (see
# DEFAULT_PREPROCESS_RANGES in dataset/multi_channel_dataset.py) before the
# model ever sees it, so these are the same placeholder ImageNet+0.5 values
# used by config_scaled_uint8.ini, kept for a fair comparison against that run
# rather than re-measured per dataset.
image_mean = 0.4850,0.4560,0.4060,0.5000,0.5000,0.5000,0.5000,0.5000
image_std = 0.2290,0.2240,0.2250,0.5000,0.5000,0.5000,0.5000,0.5000
# Derived from data/new_data_chm_update/train_plot_masks via
# scripts/compute_anchor_sizes.py (11-plot CHM-update subset, not the full
# 26-plot new_data set - re-derive if more CHM-updated plots are added).
anchor_sizes = 32,40,51; 64,81,102; 128,161,203; 256,323,406; 512,645,813
anchor_aspect_ratios = 0.63,1.0,1.28

[NEW_CHM]
# Provenance only (train.py doesn't read this section) - see
# scripts/build_chm_updated_dataset.py, which produced dataset_dir above from
# 14 plots (11 train / 3 test) that received a new, already per-plot-clipped
# CHM capture.
CHM_CLIP_DIR = data/tiff/new/CHM_clip_by_plot
SOURCE_TRAIN_PLOTS_DIR = data/new_data/cropped_plots/train
SOURCE_TEST_PLOTS_DIR = data/new_data/cropped_plots/test
OUTPUT_DIR = data/new_data_chm_update

[SLICING]
# Only TEST_OUTPUT_DIR is read (by scripts/evaluate_test_set.py's DATASET_DIR
# fallback) - train.py itself only reads [TRAIN] dataset_dir above.
TEST_OUTPUT_DIR = data/new_data_chm_update/dataset_sliced_800_test
