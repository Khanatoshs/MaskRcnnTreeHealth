[TRAIN]
# 2026-09 annotation update: AnnotationRGB.shp's tree_class is 3-tier (1=healthy,
# 2=mild, 3=severe, no "moderate"), not the old 4-tier 0-indexed scheme - see
# [MASKS] CLASS_ID_OFFSET below. background(0) + 3 health classes = 4.
num_classes = 4
num_input_channels = 8
batch_size = 2
val_batch_size = 1
learning_rate = 1e-4
weight_decay = 5e-4
num_epochs = 100
early_stopping_patience = 30
# Learning-rate schedule, stepped per epoch. Warmup eases the large gradients the
# randomly-initialized heads produce early; decay lets the model settle into the
# minimum rather than bouncing around it at full step size. A constant LR left
# val_loss bottoming out by epoch 5-16 and rising afterwards.
warmup_epochs = 10
warmup_start_factor = 0.1
# none | cosine | step
lr_schedule = cosine
lr_min_factor = 0.01
# What decides the best checkpoint and early stopping: pooled_f1 | val_loss.
# val_loss repeatedly saved a barely-trained model (epoch 5 of 35 on the last run)
# because it bottoms out while detection quality is still improving. pooled_f1 is
# tp/fp/fn summed over the whole validation split, divided once - the same
# statistic scripts/evaluate_test_set.py reports.
checkpoint_monitor = pooled_f1
checkpoint_dir = results/checkpoints_new_data_scaled_uint8_3class
metrics_dir = results/checkpoints_new_data_scaled_uint8_3class/metrics
num_workers = 2
pin_memory = True
amp = False
save_best_only = True
iou_threshold = 0.5
dataset_dir = data/new_data/dataset_sliced_800
log_level = INFO
log_file = train_new_data_scaled_uint8_3class.log
device = cuda
train_val_split = 0.8
# Split train/val by whole plots, not by tile. Tiles overlap 50%, so a tile-level
# split leaks: 95% of val tiles would share pixels (and trees) with a train tile.
split_by_plot = true
# Masks encode class_id * 10000 + instance_index (see scripts/create_masks.py).
mask_label_divisor = 10000
# Image preprocessing mode: 'native' uses the project's current model-side
# normalization (RGB ImageNet stats + measured stats for extra bands); 'scaled_uint8'
# follows the alternate project approach and rescales each band to a physical range
# before converting to [0, 1].
input_preprocessing = scaled_uint8
# For the scaled_uint8 path each band is rescaled to a physical range before
# converting to [0, 1], so the non-RGB channels use the placeholder 0.5/0.5
# convention (matching config_scaled_uint8.ini, run F's config) rather than the
# native-mode measured stats above. RGB still keeps ImageNet stats.
image_mean = 0.4850,0.4560,0.4060,0.5000,0.5000,0.5000,0.5000,0.5000
image_std = 0.2290,0.2240,0.2250,0.5000,0.5000,0.5000,0.5000,0.5000
# One anchor size per FPN level. These are tuned to the measured crown range
# (p1 64 px, p50 181 px, p99 403 px) rather than to the pyramid's strides.
#
# A stride-respecting pyramid (32,40,51; 64,81,102; ... 512,645,813) was tried and
# measurably lost: F1 0.584 -> 0.531 and AP@0.50 0.694 -> 0.626. It raised recall
# 0.597 -> 0.662 and cut missed crowns 332 -> 249 as intended, but tripled the
# anchors per location (9 vs 3) with sizes - 32-51 and 512-813 - that no crown in
# this dataset ever matches, and the extra proposals nearly doubled false positives
# (499 -> 925). Don't reinstate it without also constraining the range to the data.
anchor_sizes = 112,144,184,216,288
anchor_aspect_ratios = 0.62,1.0,1.36

[EVAL]
# scripts/evaluate_test_set.py. Everything it needs lives here; the CLI only
# exists for one-off experiments and defaults to these values.
CHECKPOINT = results/checkpoints_new_data_scaled_uint8_3class/maskrcnn_best.pth
# 'all' scores every tile in DATASET_DIR (use for the held-out test set);
# 'val' reproduces train.py's plot-level validation split.
SPLIT = all
DATASET_DIR = data/new_data/dataset_sliced_800_test
SCORE_THRESHOLD = 0.5
IOU_THRESHOLD = 0.5
OUT_DIR = results/checkpoints_new_data_scaled_uint8_3class/metrics
# Only needed for checkpoints saved before the architecture was recorded inside
# them. Newer checkpoints carry their own anchors and normalization, which always
# win over these. Leave blank unless scoring an old checkpoint.
LEGACY_ANCHOR_SIZES =
LEGACY_ANCHOR_ASPECT_RATIOS =
LEGACY_IMAGE_MEAN =
LEGACY_IMAGE_STD =

[VISUALIZE]
# scripts/visualize_predictions.py - renders ground truth beside predictions so
# detections can be inspected by eye rather than only as counts.
CHECKPOINT = checkpoints_new_data/maskrcnn_best.pth
SPLIT = val
DATASET_DIR = data/dataset_sliced_800
NUM_TILES = 10
SCORE_THRESHOLD = 0.5
IOU_THRESHOLD = 0.5
OUT = checkpoints_new_data/visualizations/predictions_val.png
# Same rule as [EVAL]: only for checkpoints predating the stored architecture.
LEGACY_ANCHOR_SIZES =
LEGACY_ANCHOR_ASPECT_RATIOS =
LEGACY_IMAGE_MEAN =
LEGACY_IMAGE_STD =

[MULTICHANNEL]
rgb_img_path = data/tiff/rgb_new2.tiff
ndvi_img_path = data/tiff/new/ndvi_ge2m.tif
chm_img_path = data/tiff/new/chm_ge2m.tif
cire_img_path = data/tiff/new/cire_ge2m.tif
gndvi_img_path = data/tiff/new/gndvi_ge2m.tif
ndre_img_path = data/tiff/new/ndre_ge2m.tif
output_dir = results
output_name = stacked_8ch_out_new_data
log_level = INFO

[CUT_PLOTS]
VRT_FILE = results/stacked_8ch_out_new_data.vrt
PLOT_SHAPEFILE = data/annotations/0831_v3/Plot_bound0831.shp
OUTPUT_FOLDER = data/new_data/cropped_plots
log_level = INFO

[MASKS]
PLOTS_DIR = data/new_data/cropped_plots/train
TREE_SHAPEFILE = data/annotations/0831_v3/AnnotationRGB.shp
OUTPUT_DIR = data/new_data/train_plot_masks
TREE_CLASS_PROPERTY = tree_class
# AnnotationRGB.shp's tree_class is already 1-indexed (1=healthy, 2=mild, 3=severe -
# no 0, no "moderate" tier), unlike the old mesh.shp/NDVI_mean3.shp scheme (0-indexed
# 0-3). class_id = tree_class + CLASS_ID_OFFSET, and class_id 0 is reserved for
# background, so this must be 0 here. The old pipeline needs 1 - don't copy this
# value into a config that still points TREE_SHAPEFILE at NDVI_mean3.shp.
CLASS_ID_OFFSET = 0
# Held-out plots (mesh.shp class=test). Masked so they can be sliced and used
# for final evaluation only - never for training or validation.
TEST_PLOTS_DIR = data/new_data/cropped_plots/test
TEST_OUTPUT_DIR = data/new_data/test_plot_masks
# Drop annotations whose crown top (max CHM inside the polygon) is below this many
# metres. Stands here are mature (median height ~21 m), so 2 m only removes a
# handful of annotations sitting at or below ground level. Leave blank to disable.
MIN_TREE_HEIGHT = 2.0
CHM_BAND = 4

[SLICING]
PLOTS_DIR = data/new_data/cropped_plots/train
MASKS_DIR = data/new_data/train_plot_masks
OUTPUT_DIR = data/new_data/dataset_sliced_800
WINDOW_SIZE = 800
OVERLAP_PCT = 50.0
log_level = INFO
# Remove an instance from a tile when less than this fraction of its full crown
# falls inside that tile. Tiling cuts crowns at the border and leaves slivers -
# every COCO-'small' ground-truth box in this dataset is such a fragment, not a
# small tree. With 50% overlap every crown is whole in some tile, so no tree is
# lost. Leave blank to disable.
MIN_INSTANCE_COMPLETENESS = 0.6
# Held-out test plots, sliced into a separate dataset used only for final evaluation.
TEST_PLOTS_DIR = data/new_data/cropped_plots/test
TEST_MASKS_DIR = data/new_data/test_plot_masks
TEST_OUTPUT_DIR = data/new_data/dataset_sliced_800_test

[NEW_CHM]
# Rebuilds the 8-band dataset with an updated CHM band (band 4) from a new CHM
# capture that arrives already cut into one GeoTIFF per plot (not a full
# mosaic), so it can't go through image_merging_vrt.py/cut_plots.py. RGB,
# NDVI, CIRE, GNDVI, NDRE are reused unchanged from SOURCE_*_PLOTS_DIR. Clip
# filenames don't encode the plot ID, so plots are matched to clips by
# bounding-box overlap. See scripts/build_chm_updated_dataset.py.
CHM_CLIP_DIR = data/tiff/new/CHM_clip_by_plot
SOURCE_TRAIN_PLOTS_DIR = data/new_data/cropped_plots/train
SOURCE_TEST_PLOTS_DIR = data/new_data/cropped_plots/test
CHM_BAND = 4
# Minimum fraction of a plot's area that must fall inside a CHM clip's bounds
# for the two to be considered a match.
MIN_OVERLAP_FRACTION = 0.98
OUTPUT_DIR = data/new_data_chm_update
TREE_SHAPEFILE = data/annotations/0831_v3/AnnotationRGB.shp
TREE_CLASS_PROPERTY = tree_class
MIN_TREE_HEIGHT = 2.0
WINDOW_SIZE = 800
OVERLAP_PCT = 50.0
MIN_INSTANCE_COMPLETENESS = 0.6
log_level = INFO