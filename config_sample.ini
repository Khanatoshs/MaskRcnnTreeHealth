[TRAIN]
num_classes = 2
batch_size = 1
learning_rate = 1e-4
weight_decay = 1e-4
num_epochs = 10
checkpoint_dir = checkpoints
num_workers = 0
pin_memory = True
amp = False
save_best_only = False
iou_threshold = 0.5
dataset_dir = data/dataset_sliced_800
log_level = INFO

[MULTICHANNEL]
rgb_img_path = data/rgb_input.tif
ndvi_img_path = data/ndvi_input.tif
chm_img_path = data/chm_input.tif
output_dir = results
output_name = stacked_5ch_out
log_level = INFO

[CUT_PLOTS]
VRT_FILE = results/stacked_5ch_out.vrt
PLOT_SHAPEFILE = data/Annotations/plot_bound/plot_bound.shp
OUTPUT_FOLDER = data/cropped_plots
log_level = INFO

[MASKS]
PLOTS_DIR = data/cropped_plots
TREE_SHAPEFILE = data/Annotations/NDVI_mean3.shp
OUTPUT_DIR = data/plot_masks

[SLICING]
PLOTS_DIR = data/cropped_plots
MASKS_DIR = data/plot_masks
OUTPUT_DIR = data/dataset_sliced_800
WINDOW_SIZE = 800
OVERLAP_PCT = 50.0
log_level = INFO