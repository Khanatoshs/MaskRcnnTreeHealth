[TRAIN]
num_classes = 2
num_input_channels = 5
batch_size = 1
val_batch_size = 1
learning_rate = 1e-4
weight_decay = 5e-4
num_epochs = 10
early_stopping_patience = 30
checkpoint_dir = checkpoints
metrics_dir = checkpoints/metrics
num_workers = 0
pin_memory = True
amp = False
save_best_only = True
iou_threshold = 0.5
dataset_dir = data/dataset_sliced_800
log_level = INFO
device = cuda
train_val_split = 0.8
# Split train/val by whole plots, not by tile. Tiles overlap, so a tile-level split
# puts spatially overlapping tiles (sharing pixels and trees) on both sides.
split_by_plot = true
# Masks encode class_id * divisor + instance_index (see scripts/create_masks.py).
# Must match LABEL_DIVISOR there.
mask_label_divisor = 10000
# Comma-separated, one size per FPN level (5 for resnet50_fpn). Leave blank to use
# torchvision's defaults (32,64,128,256,512). Derive real values with:
#   python scripts/compute_anchor_sizes.py --masks_dir <your masks dir>
anchor_sizes =
anchor_aspect_ratios =

[MULTICHANNEL]
rgb_img_path = data/rgb_input.tif
ndvi_img_path = data/ndvi_input.tif
chm_img_path = data/chm_input.tif
output_dir = results
output_name = stacked_5ch_out
log_level = INFO

[CUT_PLOTS]
VRT_FILE = results/stacked_5ch_out.vrt
PLOT_SHAPEFILE = data/Annotations/plot_bound/plot_bound.shp
OUTPUT_FOLDER = data/cropped_plots
log_level = INFO

[MASKS]
PLOTS_DIR = data/cropped_plots/train
TREE_SHAPEFILE = data/Annotations/NDVI_mean3.shp
OUTPUT_DIR = data/train_plot_masks
TREE_CLASS_PROPERTY = tree_class
# Optional: held-out test plots (plot shapefile class=test). Leave blank to skip.
TEST_PLOTS_DIR = data/cropped_plots/test
TEST_OUTPUT_DIR = data/test_plot_masks

[SLICING]
PLOTS_DIR = data/cropped_plots/train
MASKS_DIR = data/train_plot_masks
OUTPUT_DIR = data/dataset_sliced_800
WINDOW_SIZE = 800
OVERLAP_PCT = 50.0
log_level = INFO
# Optional: slice the held-out test plots into their own dataset, used only for
# final evaluation - train.py never reads this directory.
TEST_PLOTS_DIR = data/cropped_plots/test
TEST_MASKS_DIR = data/test_plot_masks
TEST_OUTPUT_DIR = data/dataset_sliced_800_test