[TRAIN]
num_classes = 5
num_input_channels = 8
batch_size = 2
val_batch_size = 1
learning_rate = 1e-4
weight_decay = 5e-4
num_epochs = 100
early_stopping_patience = 30
warmup_epochs = 10
warmup_start_factor = 0.1
lr_schedule = cosine
lr_min_factor = 0.01
checkpoint_monitor = pooled_f1
checkpoint_dir = results/checkpoints_scaled_uint8
metrics_dir = results/checkpoints_scaled_uint8/metrics
num_workers = 2
pin_memory = True
amp = False
save_best_only = True
iou_threshold = 0.5
dataset_dir = data/new_data/dataset_sliced_800
log_level = INFO
log_file = train_scaled_uint8.log
device = cuda
train_val_split = 0.8
split_by_plot = true
mask_label_divisor = 10000
input_preprocessing = scaled_uint8
# For the scaled_uint8 path the raw data statistics are different from the native mode.
# These values are kept as a working default for the comparison run; recompute them
# from the scaled dataset if the run is meant to be a fair benchmark.
image_mean = 0.4850,0.4560,0.4060,0.5000,0.5000,0.5000,0.5000,0.5000
image_std = 0.2290,0.2240,0.2250,0.5000,0.5000,0.5000,0.5000,0.5000
anchor_sizes = 112,144,184,216,288
anchor_aspect_ratios = 0.62,1.0,1.36

[MULTICHANNEL]
rgb_img_path = data/tiff/rgb_new2.tiff
ndvi_img_path = data/tiff/ndvi_new3.tiff
chm_img_path = data/tiff/chm_Re11_Clip11.tif
cire_img_path = data/tiff/cire48sampled_Clip1.tif
gndvi_img_path = data/tiff/gndvi48Nsamp_Clip11.tif
ndre_img_path = data/tiff/ndre48samp_Clip11.tif
output_dir = results
output_name = stacked_8ch_out
log_level = INFO

[CUT_PLOTS]
VRT_FILE = results/stacked_8ch_out.vrt
PLOT_SHAPEFILE = data/annotations/mesh.shp
OUTPUT_FOLDER = data/cropped_plots
log_level = INFO

[MASKS]
PLOTS_DIR = data/cropped_plots/train
TREE_SHAPEFILE = data/annotations/NDVI_mean3.shp
OUTPUT_DIR = data/train_plot_masks
TREE_CLASS_PROPERTY = tree_class
TEST_PLOTS_DIR = data/cropped_plots/test
TEST_OUTPUT_DIR = data/test_plot_masks
MIN_TREE_HEIGHT = 2.0
CHM_BAND = 4

[SLICING]
PLOTS_DIR = data/cropped_plots/train
MASKS_DIR = data/train_plot_masks
OUTPUT_DIR = data/dataset_sliced_800
WINDOW_SIZE = 800
OVERLAP_PCT = 50.0
log_level = INFO
TEST_PLOTS_DIR = data/cropped_plots/test
TEST_MASKS_DIR = data/test_plot_masks
TEST_OUTPUT_DIR = data/dataset_sliced_800_test
