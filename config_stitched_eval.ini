[STITCHED_EVAL]
# scripts/evaluate_stitched_plots.py. Everything the script needs *other than* the
# per-run checkpoint/dataset/plot paths (those differ per run and are passed via
# CLI - see run_all_stitched_eval.sh) lives here.

# Predictions below this score are dropped when computing metrics (NMS and the
# min-crown-size filter run on every raw detection first, before this).
SCORE_THRESHOLD = 0.5
# IoU threshold for matching a prediction to a ground-truth crown.
IOU_THRESHOLD = 0.5
# IoU threshold for the class-agnostic NMS pass that merges duplicate detections of
# the same tree across overlapping tile borders (tiles are cut at 50% overlap, so a
# crown near a seam is very often detected twice, once per tile). Lower = more
# aggressive merging.
NMS_IOU_THRESHOLD = 0.3
# Drop any post-NMS prediction whose box side length (sqrt(width*height)) is below
# this many pixels - too small to plausibly be a tree crown at this GSD. The
# smallest real crowns measured by scripts/compute_anchor_sizes.py across this
# project's datasets sit around p5 ~90-95px, so this is a generous floor meant to
# catch degenerate/noise boxes, not to trim the real size distribution.
MIN_CROWN_SIDE_PX = 20
# Inference batch size (tiles are mostly WINDOW_SIZE x WINDOW_SIZE but can be
# smaller at a plot's edge, so batch_size=1 avoids any stacking assumption).
BATCH_SIZE = 1
# 'boxes' (default): per-plot visualization PNGs draw box outlines only, as
# before. 'masks': also tints each kept prediction's instance mask over the
# crown (ground truth stays box-only - it has no predicted mask to show).
# Fetching/cropping masks costs a little extra time and memory during inference,
# so it's off by default and only paid when actually visualizing with it.
VISUALIZATION_STYLE = boxes
# Default output root - always overridden per run via --output_dir in practice.
OUTPUT_DIR = results/stitched_metrics/default_run
