[TRAIN]
# 2026-09-04 new annotation set: data/annotations/0904/{Plot_59_0904,Annotation0904}.shp,
# 59 plots (49 train / 10 test) - a further-expanded annotation pass over the same
# new_plots/new_data site (43 -> 59 plots). tree_class already 1-indexed 3-tier
# (1=healthy, 2=mild, 3=severe - no "moderate"), same convention as new_plots/
# 0831_v3 - see [MASKS] CLASS_ID_OFFSET below. background(0) + 3 health classes = 4.
num_classes = 4
num_input_channels = 10
batch_size = 2
val_batch_size = 1
learning_rate = 1e-4
weight_decay = 5e-4
num_epochs = 100
early_stopping_patience = 30
warmup_epochs = 10
warmup_start_factor = 0.1
# none | cosine | step
lr_schedule = cosine
lr_min_factor = 0.01
# What decides the best checkpoint and early stopping: pooled_f1 | val_loss.
checkpoint_monitor = pooled_f1
checkpoint_dir = results/checkpoints_0904_10ch_scaled_uint8
metrics_dir = results/checkpoints_0904_10ch_scaled_uint8/metrics
num_workers = 2
pin_memory = True
amp = False
save_best_only = True
iou_threshold = 0.5
dataset_dir = data/new_0904_10ch/dataset_sliced_800
log_level = INFO
log_file = train_0904_10ch_scaled_uint8.log
device = cuda
train_val_split = 0.8
# Split train/val by whole plots, not by tile (see CLAUDE.md).
split_by_plot = true
# Masks encode class_id * 10000 + instance_index (see scripts/create_masks.py).
mask_label_divisor = 10000
# Image preprocessing mode: 'native' uses the project's current model-side
# normalization (RGB ImageNet stats + measured stats for extra bands); 'scaled_uint8'
# follows the alternate project approach and rescales each band to a physical range
# before converting to [0, 1].
input_preprocessing = scaled_uint8
# For the scaled_uint8 path each band is clipped to a physical range and rescaled to
# [0, 1] first (see DEFAULT_PREPROCESS_RANGES in dataset/multi_channel_dataset.py,
# which now carries entries for the two new bands 9-10), so the non-RGB channels use
# the placeholder 0.5/0.5 convention rather than measured stats. RGB keeps ImageNet.
image_mean = 0.4850,0.4560,0.4060,0.5000,0.5000,0.5000,0.5000,0.5000,0.5000,0.5000
image_std = 0.2290,0.2240,0.2250,0.5000,0.5000,0.5000,0.5000,0.5000,0.5000,0.5000
# scripts/compute_anchor_sizes.py --masks_dir data/new_0904_10ch/train_plot_masks measured
# crown side-length p50=177px/p99=405px here - nearly identical to new_plots'
# p50=178px/p99=407px and data/new_data's p50=181px/p99=403px (same site, larger
# annotation pass) - so the same anchors as F/I/J/K/L/M are reused rather than the
# script's freshly-computed stride-respecting pyramid (32,40,51; 64,81,102; ...),
# which CLAUDE.md documents as measurably worse on this imagery (F1 0.584 -> 0.531)
# despite being what the script recommends by default.
anchor_sizes = 112,144,184,216,288
anchor_aspect_ratios = 0.62,1.0,1.36

[EVAL]
# scripts/evaluate_test_set.py. Everything it needs lives here; the CLI only
# exists for one-off experiments and defaults to these values.
CHECKPOINT = results/checkpoints_0904_10ch_scaled_uint8/maskrcnn_best.pth
SPLIT = all
DATASET_DIR = data/new_0904_10ch/dataset_sliced_800_test
SCORE_THRESHOLD = 0.5
IOU_THRESHOLD = 0.5
OUT_DIR = results/checkpoints_0904_10ch_scaled_uint8/metrics
LEGACY_ANCHOR_SIZES =
LEGACY_ANCHOR_ASPECT_RATIOS =
LEGACY_IMAGE_MEAN =
LEGACY_IMAGE_STD =

[MULTICHANNEL]
rgb_img_path = data/tiff/new/rgb_new2.tiff
ndvi_img_path = data/tiff/new/ndvi_ge2m.tif
chm_img_path = data/tiff/new/chm_ge2m.tif
cire_img_path = data/tiff/new/cire_ge2m.tif
gndvi_img_path = data/tiff/new/gndvi_ge2m.tif
ndre_img_path = data/tiff/new/ndre_ge2m.tif
# Extra sources appended as bands 9, 10, ... after the eight fixed ones (so band 4
# stays CHM, which [MASKS] CHM_BAND and the image_mean/image_std order depend on).
# Both are ESRI ArcInfo binary grid directories, opened via GDAL's AIG driver:
#   band 9  = EL        - Byte-quantised elevation grid (nodata 255)
#   band 10 = INTENSITY - LiDAR return intensity (Int16, nodata -32768)
# NOTE: the elevation grid lives at 'el (1)/el' (spaces/parens intentional - that is
# where the complete re-copy landed). The sibling 'data/tiff/new/el/el' is an earlier
# TRUNCATED copy missing its z001001x.adf block index: it opens fine and then hard-fails
# on 11 of 59 plots. Do not point at it. scripts/check_extra_bands.py catches the mixup.
extra_band_paths = data/tiff/new/el/el (1)/el, data/tiff/new/intensity/intensity
output_dir = results
output_name = stacked_10ch_out_0904
log_level = INFO

[CUT_PLOTS]
# Same underlying imagery/VRT as data/new_data (same site, no new raster capture) -
# reused as-is; only the plot boundaries and tree annotations are new.
VRT_FILE = results/stacked_10ch_out_0904.vrt
PLOT_SHAPEFILE = data/annotations/0904/Plot_59_0904.shp
OUTPUT_FOLDER = data/new_0904_10ch/cropped_plots
log_level = INFO

[MASKS]
PLOTS_DIR = data/new_0904_10ch/cropped_plots/train
TREE_SHAPEFILE = data/annotations/0904/Annotation0904.shp
OUTPUT_DIR = data/new_0904_10ch/train_plot_masks
TREE_CLASS_PROPERTY = tree_class
# Annotation0904.shp's tree_class is already 1-indexed (1=healthy, 2=mild, 3=severe -
# no 0, no "moderate" tier), same as new_plots/0831_v3. class_id = tree_class +
# CLASS_ID_OFFSET, and class_id 0 is reserved for background, so this must be 0 here.
CLASS_ID_OFFSET = 0
# Held-out plots (Plot_59_0904.shp class=test). Masked so they can be sliced and used
# for final evaluation only - never for training or validation.
TEST_PLOTS_DIR = data/new_0904_10ch/cropped_plots/test
TEST_OUTPUT_DIR = data/new_0904_10ch/test_plot_masks
# Drop annotations whose crown top (max CHM inside the polygon) is below this many
# metres - see CLAUDE.md.
MIN_TREE_HEIGHT = 2.0
CHM_BAND = 4

[SLICING]
PLOTS_DIR = data/new_0904_10ch/cropped_plots/train
MASKS_DIR = data/new_0904_10ch/train_plot_masks
OUTPUT_DIR = data/new_0904_10ch/dataset_sliced_800
WINDOW_SIZE = 800
OVERLAP_PCT = 50.0
log_level = INFO
MIN_INSTANCE_COMPLETENESS = 0.6
TEST_PLOTS_DIR = data/new_0904_10ch/cropped_plots/test
TEST_MASKS_DIR = data/new_0904_10ch/test_plot_masks
TEST_OUTPUT_DIR = data/new_0904_10ch/dataset_sliced_800_test
